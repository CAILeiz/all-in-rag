# 本机可直接拉取的 Milvus standalone 编排（独立文件，不依赖 docker-compose.yml）
# 与官方 compose 唯一差异：
#   etcd   -> rancher/mirrored-coreos-etcd:v3.5.16（Docker Hub 上的同一版本，quay.io 当前不通）
#   minio  -> bitnamilegacy/minio:latest（Docker Hub 官方 minio tag 已下架）
#   minio 端口 -> 19000/19001（宿主机 9000/9001 已被其它服务占用）
#
# 用法：docker compose -f docker-compose.local.yml up -d
version: '3.5'

services:
  etcd:
    container_name: milvus-etcd
    image: rancher/mirrored-coreos-etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.14
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.5
    environment:
      # Attu 是 Milvus 的 Web 管理界面，打开 http://localhost:18000 即可浏览数据
      MILVUS_URL: http://host.docker.internal:19530
    ports:
      - "18000:3000"
    depends_on:
      - "standalone"

networks:
  default:
    name: milvus
